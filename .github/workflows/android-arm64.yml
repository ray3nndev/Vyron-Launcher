name: Vyron Android ARM64 debug build

on:
  push:
    branches:
      - integration/zalith-ui-shell
    paths:
      - 'ZalithLauncher/**'
      - 'LayerController/**'
      - 'InputMap/**'
      - 'PetLib/**'
      - 'LWJGL/**'
      - 'Terracotta/**'
      - 'ColorPicker/**'
      - 'CardGrid/**'
      - 'Guide/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-android-arm64
  cancel-in-progress: true

jobs:
  debug-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Vyron
        uses: actions/checkout@v5
        with:
          ref: integration/zalith-ui-shell

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform and pinned NDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "platforms;android-37.2" "build-tools;37.0.0" "ndk;25.2.9519653"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: |
          version="4.1.2"
          curl -fL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build ARM64 debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :ZalithLauncher:assembleDebug -Darch=arm64 --stacktrace

      - name: Upload ARM64 debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vyron-debug-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
