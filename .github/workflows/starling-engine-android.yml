name: Vyron Starling Android engine

on:
  push:
    branches: [integration/zalith-ui-shell]
    paths:
      - ".gitmodules"
      - "engine/starling"
      - ".github/workflows/starling-engine-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyron-starling-engine-arm64
  cancel-in-progress: true

jobs:
  build-arm64-engine:
    name: Build Starling Rust engine (Android ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Vyron and pinned Starling source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned Starling revision
        run: |
          expected="$(git ls-tree HEAD engine/starling | awk '{print $3}')"
          actual="$(git -C engine/starling rev-parse HEAD)"
          test -n "$expected"
          test "$actual" = "$expected"
          grep -Fq 'url = https://github.com/ray3nndev/vyron-starling.git' .gitmodules
          echo "Building Vyron-pinned Starling revision $(git -C engine/starling rev-parse --short HEAD)"

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android SDK platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust Android target and cargo-ndk
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
          rustup default 1.95.0
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build native engine library
        working-directory: engine/starling
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,--build-id=sha1"
        run: |
          cargo ndk -t arm64-v8a --platform 26 build --profile quick -p horizon-android
          test -s target/aarch64-linux-android/quick/libhorizon_android.so
          file target/aarch64-linux-android/quick/libhorizon_android.so
          ls -lh target/aarch64-linux-android/quick/libhorizon_android.so

      - name: Upload engine library for integration
        uses: actions/upload-artifact@v4
        with:
          name: vyron-starling-engine-arm64
          path: engine/starling/target/aarch64-linux-android/quick/libhorizon_android.so
          if-no-files-found: error
          retention-days: 14
